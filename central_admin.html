<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CWF Central Command | ระบบส่วนกลาง</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body { background-color: #F8FAFC; font-family: 'Prompt', sans-serif; color: #1E293B; }
    
    .header { background: linear-gradient(135deg, #0F172A, #1E3A8A); color: white; padding: 40px 20px 80px; text-align: center; border-radius: 0 0 24px 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .admin-card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); max-width: 600px; margin: -50px auto 30px; position: relative; }
    
    .form-control { border-radius: 12px; padding: 14px 16px; background-color: #F1F5F9; border: 1px solid #CBD5E1; font-weight: 500; }
    .form-control:focus { background-color: #FFFFFF; border-color: #2563EB; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15); }
    
    .btn-create { background-color: #10B981; color: white; border-radius: 14px; padding: 16px; font-weight: 700; font-size: 1.05rem; border: none; width: 100%; transition: 0.2s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .btn-create:active { transform: scale(0.98); }
    
    .network-item { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

<div class="header">
  <h3 class="fw-bold mb-1"><i class="fa-solid fa-server me-2"></i>CWF Central Command</h3>
  <p class="text-white-50">ระบบบริหารจัดการเครือข่ายสวัสดิการแห่งชาติ</p>
</div>

<div class="container px-3">
  
  <div class="admin-card">
    <h5 class="fw-bold text-dark mb-4"><i class="fa-solid fa-handshake text-primary me-2"></i>เพิ่มเครือข่ายใหม่ (MOU)</h5>
    
    <div class="alert alert-info border-0 bg-primary bg-opacity-10 text-primary small fw-bold mb-4 rounded-3 p-3">
      <i class="fa-solid fa-circle-info me-1"></i> เมื่อกดสร้าง ระบบจะก๊อปปี้ฐานข้อมูลใหม่ให้เทศบาลนี้โดยอัตโนมัติ
    </div>
    
    <form id="provisionForm" onsubmit="handleProvisioning(event)">
      <div class="mb-3">
        <label class="small text-muted fw-bold mb-1 ms-1">ชื่อเทศบาล / ตำบล (ต้องตรงกับที่จะให้ชาวบ้านเลือก)</label>
        <input type="text" class="form-control" name="networkName" placeholder="เช่น เทศบาลตำบลแว้ง" required>
      </div>
      
      <div class="mb-4">
        <label class="small text-muted fw-bold mb-1 ms-1">อีเมลประธานกองทุน (เพื่อให้สิทธิ์เข้าฐานข้อมูล)</label>
        <input type="email" class="form-control" name="adminEmail" placeholder="เช่น admin@waeng.go.th" required>
      </div>
      
      <button type="submit" class="btn-create" id="btnCreate"><i class="fa-solid fa-wand-magic-sparkles me-2"></i> สร้างระบบกองทุนใหม่</button>
    </form>
  </div>

  <div class="admin-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h5 class="fw-bold text-dark mb-0"><i class="fa-solid fa-network-wired text-success me-2"></i>เครือข่ายที่ Active</h5>
      <button class="btn btn-sm btn-light border rounded-pill" onclick="loadNetworks()"><i class="fa-solid fa-rotate"></i></button>
    </div>
    
    <div id="networkList">
      <div class="text-center text-muted small py-3">กำลังโหลดข้อมูลเครือข่าย...</div>
    </div>
  </div>

</div>

<script>
  // ⚠️ 1. ใส่ URL ของ API Web App ระบบกลาง (Master Hub) ตรงนี้
  const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbwJ6t3rVDvZFDHCdrGpgpAAjwJ_vHDM5QIDAG6n3gr8ZUwBF2pZ2vVGlEkGCbBTi_z4gQ/exec";

  document.addEventListener("DOMContentLoaded", () => {
    loadNetworks();
  });

  // 🚀 ฟังก์ชันสั่งสร้างระบบกองทุนใหม่ (Automated Provisioning)
  async function handleProvisioning(e) {
    e.preventDefault();
    const btn = document.getElementById('btnCreate');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังสร้างฐานข้อมูล...';
    
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.action = "provisionNetwork"; // บอก API กลางว่าให้ทำงานสร้างฐานข้อมูล
    
    try {
      const res = await fetch(CENTRAL_API_URL, { 
        method: "POST", 
        body: JSON.stringify(payload) 
      }).then(r=>r.json());
      
      if (res.status === 'success') {
        Swal.fire({
          title: 'สร้างระบบสำเร็จ!',
          text: `ระบบเตรียมฐานข้อมูลสำหรับ ${payload.networkName} เรียบร้อยแล้ว`,
          icon: 'success',
          confirmButtonColor: '#10B981'
        });
        e.target.reset(); // ล้างฟอร์ม
        loadNetworks(); // โหลดรายชื่อใหม่
      } else {
        Swal.fire('ข้อผิดพลาด', res.message, 'error');
      }
    } catch (err) {
      Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบกลางได้', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles me-2"></i> สร้างระบบกองทุนใหม่';
    }
  }

  // 🌐 ฟังก์ชันดึงรายชื่อเทศบาลที่มีการ MOU แล้ว
  async function loadNetworks() {
    const listDiv = document.getElementById('networkList');
    listDiv.innerHTML = '<div class="text-center text-muted small py-3"><div class="spinner-border spinner-border-sm text-primary mb-2"></div><br>กำลังโหลด...</div>';
    
    try {
      const res = await fetch(CENTRAL_API_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "getAvailableNetworks" }) 
      }).then(r=>r.json());
      
      if(res.status === 'success' && res.data.length > 0) {
        listDiv.innerHTML = res.data.map(net => `
          <div class="network-item">
            <div>
              <h6 class="fw-bold mb-1 text-dark">${net}</h6>
              <span class="badge bg-success bg-opacity-10 text-success rounded-pill" style="font-size:0.65rem;">Active</span>
            </div>
            <i class="fa-solid fa-check text-success"></i>
          </div>
        `).join('');
      } else {
        listDiv.innerHTML = '<div class="text-center text-muted small py-3">ยังไม่มีเครือข่าย</div>';
      }
    } catch (e) {
      listDiv.innerHTML = '<div class="text-center text-danger small py-3">โหลดข้อมูลล้มเหลว</div>';
    }
  }
</script>
</body>
</html>
